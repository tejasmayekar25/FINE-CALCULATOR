<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fine-Calculator Custom Expense & Loan EMI Calculator</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/png"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%234BC0C0' width='100' height='100'/><text x='50' y='70' font-size='60' fill='white' text-anchor='middle' font-weight='bold'>₹</text></svg>">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="navbar-container">

      <div class="navbar-brand">
        <img
          src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='white' width='100' height='100' rx='10'/><text x='50' y='70' font-size='60' fill='%234BC0C0' text-anchor='middle' font-weight='bold'>₹</text></svg>"
          alt="Logo"
          class="navbar-logo">

        Fine-Calculator
      </div>

      <div class="navbar-menu">
        <a href="#expenses" class="navbar-link">Expenses</a>
        <a href="#emi" class="navbar-link">EMI Calculator</a>
        <a href="#incomeSection" class="navbar-link">Income</a>
        <a href="#charts" class="navbar-link">Charts</a>
      </div>

    </div>
  </nav>

  <div class="container">

    <h1>Fine-Calculator</h1>

    <!-- Expenses -->
    <section id="expenses">

      <h2>Add Daily Expense Categories</h2>

      <input
        type="text"
        id="expenseName"
        placeholder="Expense Name">

      <input
        type="number"
        id="expenseAmount"
        placeholder="Amount">

      <button onclick="addExpense()">
        Add Expense
      </button>

      <div
        id="expenseList"
        class="expense-list">
      </div>

      <p id="dailyTotal"></p>

    </section>

    <!-- EMI -->
    <section id="emi">

      <h2>Loan & EMI Calculator</h2>

      <input
        type="number"
        id="loan"
        placeholder="Loan Amount">

      <input
        type="number"
        id="rate"
        placeholder="Annual Interest %">

      <input
        type="number"
        id="tenure"
        placeholder="Tenure (Months)">

      <button onclick="calcEMI()">
        Calculate EMI
      </button>

      <p id="emiResult"></p>

    </section>

    <!-- Income -->
    <section id="incomeSection">

      <h2>Add Monthly Income</h2>

      <input
        type="number"
        id="income"
        placeholder="Monthly Income">

      <button onclick="updateIncome()">
        Set Income
      </button>

      <p
        id="incomeDisplay"
        style="font-weight:bold;color:#4BC0C0;">
      </p>

      <p
        id="balanceResult"
        style="font-size:18px;font-weight:bold;">
      </p>

    </section>

    <!-- Charts -->
    <section id="charts">

      <h2>Expense vs EMI Chart</h2>

      <canvas id="expenseChart"></canvas>

      <br><br>

      <h2>Budget Comparison Chart</h2>

      <canvas id="budgetChart"></canvas>

    </section>

    <br>

    <button onclick="exportToExcel()">
      Export to Excel (CSV)
    </button>

  </div>

  <script src="js/calculator.js"></script>

</body>
</html>
